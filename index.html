<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FM 19.82 · 树洞电台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-outer: #0b0a12;
      --bg-phone: #151224;
      --bg-screen: #110e1d;
      --bg-walkman: #22263a;
      --bg-walkman-face: #2d334d;
      --bg-bubble-bot: #211c36;
      --bg-bubble-user: #312852;
      --border-dark: #08070d;
      --border-hi: #485075;
      --text-main: #f4efe6;
      --text-sub: #a39bc2;
      --accent-amber: #ffae52;
      --accent-mint: #7ce8b5;
      --accent-cyan: #5ce1e6;
      --accent-coral: #ff7575;
    }

    body.theme-sunset {
      --bg-outer: #1b110d;
      --bg-phone: #291a14;
      --bg-screen: #20140f;
      --bg-walkman: #36221b;
      --bg-walkman-face: #472d24;
      --bg-bubble-bot: #36221b;
      --bg-bubble-user: #4d3025;
      --border-dark: #120a07;
      --border-hi: #6e4638;
      --text-main: #fff3e6;
      --text-sub: #cfb29f;
      --accent-amber: #ffb84d;
      --accent-mint: #8be0a4;
      --accent-cyan: #72e5eb;
      --accent-coral: #ff7b7b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background-color: var(--bg-outer);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100dvh;
      overflow: hidden;
    }

    .font-pixel {
      font-family: 'Press Start 2P', monospace;
    }

    .font-vt {
      font-family: 'VT323', monospace;
    }

    .pixel-panel {
      border: 2px solid var(--border-dark);
      box-shadow: inset 2px 2px 0 var(--border-hi), 0 3px 0 var(--border-dark);
    }

    .pixel-btn {
      border: 2px solid var(--border-dark);
      box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.24), 0 2px 0 var(--border-dark);
      transition: transform 0.08s ease, filter 0.12s ease;
    }

    .pixel-btn:hover {
      filter: brightness(1.08);
    }

    .pixel-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .studio-banner-svg {
      width: 100%;
      height: 100%;
      max-height: 124px;
      display: block;
    }

    .avatar-svg {
      width: 24px;
      height: 24px;
      display: block;
    }

    @keyframes reelSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .reel-spinning {
      animation: reelSpin 2.4s linear infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.25; }
    }
    .on-air-dot {
      animation: blink 1.4s infinite;
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .pixel-cursor {
      animation: cursorBlink 0.75s infinite;
    }

    @keyframes vuBounce {
      0%, 100% { height: 4px; }
      50% { height: 14px; }
    }
    .vu-bar-active-1 { animation: vuBounce 0.7s infinite ease-in-out; }
    .vu-bar-active-2 { animation: vuBounce 0.5s infinite ease-in-out 0.15s; }
    .vu-bar-active-3 { animation: vuBounce 0.85s infinite ease-in-out 0.25s; }
    .vu-bar-active-4 { animation: vuBounce 0.6s infinite ease-in-out 0.1s; }

    /* 保持 Walkman 机身原地完全不动，小卡带架从卡带仓顶口向上弹出 */
    .cassette-bay {
      position: relative;
      overflow: visible;
    }

    .cassette-lid-glass {
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
      transform-origin: bottom center;
    }

    .cassette-lid-glass.ejected {
      transform: perspective(360px) rotateX(-20deg);
      opacity: 0.35;
    }

    .cassette-body {
      position: relative;
      z-index: 10;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .cassette-body.ejected {
      opacity: 0.28;
    }

    .pop-up-cassette-rack {
      position: absolute;
      left: -4px;
      right: -4px;
      bottom: calc(100% + 6px);
      z-index: 35;
      transform-origin: bottom center;
      transition: transform 0.32s cubic-bezier(0.22, 1.32, 0.36, 1), opacity 0.22s ease;
    }

    .pop-up-cassette-rack.rack-closed {
      opacity: 0;
      transform: translateY(26px) scaleY(0.72);
      pointer-events: none;
    }

    .pop-up-cassette-rack.rack-open {
      opacity: 1;
      transform: translateY(0) scaleY(1);
      pointer-events: auto;
    }

    .tape-shelf::-webkit-scrollbar {
      height: 5px;
    }
    .tape-shelf::-webkit-scrollbar-thumb {
      background: #5b6591;
      border-radius: 3px;
    }

    .crt-scanlines {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
      background-size: 100% 4px;
    }
  </style>
</head>
<body class="flex items-center justify-center p-0 sm:p-4">
  <div
    id="appShell"
    style="background-color: var(--bg-phone); border-color: var(--border-dark);"
    class="w-full max-w-[440px] h-full sm:h-[94dvh] sm:max-h-[850px] sm:border-4 sm:rounded-2xl shadow-2xl flex flex-col relative overflow-hidden"
  >
    <!-- 1. 顶部电台调频栏 -->
    <header
      style="border-color: var(--border-dark); background-color: rgba(0, 0, 0, 0.32);"
      class="border-b-2 px-3.5 py-2 flex items-center justify-between gap-2 shrink-0"
    >
      <div class="flex items-center gap-2 min-w-0">
        <span class="w-2.5 h-2.5 rounded-full bg-[#ff595e] inline-block on-air-dot shrink-0"></span>
        <span style="color: var(--accent-amber);" class="font-pixel text-[10px] sm:text-[11px] tracking-tight truncate">FM 19.82</span>
        <span style="color: var(--text-sub);" class="text-xs truncate">· 树洞电台</span>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <button
          type="button"
          onclick="toggleStudioTheme()"
          style="background-color: var(--bg-bubble-bot); color: var(--accent-amber);"
          class="pixel-btn px-2 py-1 text-[11px] flex items-center gap-1 cursor-pointer"
          title="切换深夜星空 / 暖炉色调"
        >
          <span id="themeIcon">🏮</span>
          <span id="themeLabel">暖炉</span>
        </button>

        <button
          type="button"
          onclick="retuneRadio()"
          style="background-color: var(--bg-bubble-bot); color: var(--text-sub);"
          class="pixel-btn px-2 py-1 text-[11px] cursor-pointer"
          title="重新调频开场"
        >
          重调频
        </button>
      </div>
    </header>

    <!-- 2. 16-Bit 像素风深夜播音室小窗（保留卡通猫猫主播与怀旧物件） -->
    <section
      style="border-color: var(--border-dark);"
      class="border-b-2 relative h-28 sm:h-32 shrink-0 overflow-hidden bg-[#171426]"
    >
      <svg viewBox="0 0 320 88" width="100%" height="124" preserveAspectRatio="xMidYMid slice" class="studio-banner-svg" shape-rendering="crispEdges">
        <!-- 播音室墙面与木质护墙板 -->
        <rect x="0" y="0" width="320" height="88" fill="#231c38" />
        <rect x="0" y="48" width="320" height="2" fill="#161124" />
        <rect x="0" y="50" width="320" height="12" fill="#3b2621" />

        <!-- 深夜窗户与星空月亮 -->
        <rect x="16" y="8" width="74" height="38" fill="#0d1126" />
        <rect x="14" y="6" width="78" height="2" fill="#4f362d" />
        <rect x="14" y="46" width="78" height="2" fill="#4f362d" />
        <rect x="14" y="6" width="2" height="42" fill="#4f362d" />
        <rect x="90" y="6" width="2" height="42" fill="#4f362d" />
        <rect x="52" y="8" width="2" height="38" fill="#4f362d" />
        <!-- 星星与弯月 -->
        <rect x="24" y="13" width="2" height="2" fill="#fff3b0" />
        <rect x="40" y="19" width="1" height="1" fill="#ffffff" />
        <rect x="31" y="26" width="1" height="1" fill="#ffd166" />
        <rect x="64" y="13" width="2" height="2" fill="#ffffff" />
        <rect x="80" y="23" width="1" height="1" fill="#fff3b0" />
        <rect x="71" y="14" width="6" height="6" fill="#ffd166" />
        <rect x="73" y="13" width="5" height="5" fill="#0d1126" />
        <!-- 远方居民楼与鱼骨电视天线 -->
        <rect x="19" y="33" width="14" height="13" fill="#171d3b" />
        <rect x="24" y="27" width="1" height="6" fill="#4a5568" />
        <rect x="21" y="28" width="7" height="1" fill="#4a5568" />
        <rect x="22" y="30" width="5" height="1" fill="#4a5568" />
        <rect x="23" y="37" width="2" height="2" fill="#ffbe0b" />
        <rect x="60" y="31" width="18" height="15" fill="#171d3b" />
        <rect x="64" y="35" width="2" height="2" fill="#ffbe0b" />
        <rect x="71" y="39" width="2" height="2" fill="#ffbe0b" />

        <!-- 播音室长木桌 -->
        <rect x="0" y="62" width="320" height="4" fill="#6b4436" />
        <rect x="0" y="66" width="320" height="22" fill="#4a2e25" />

        <!-- 暖光复古台灯 -->
        <rect x="108" y="59" width="12" height="3" fill="#d4a373" />
        <rect x="113" y="42" width="2" height="17" fill="#d4a373" />
        <polygon points="105,42 123,42 119,33 109,33" fill="#ff9f1c" />
        <rect x="106" y="42" width="16" height="2" fill="#ffbf69" />

        <!-- 戴着大耳机的16-bit卡通猫猫主播 -->
        <g id="hostCat">
          <rect x="142" y="41" width="22" height="21" fill="#3a5a40" />
          <rect x="144" y="23" width="18" height="18" fill="#f7d098" />
          <rect x="144" y="19" width="4" height="4" fill="#f7d098" />
          <rect x="158" y="19" width="4" height="4" fill="#f7d098" />
          <rect x="145" y="20" width="2" height="2" fill="#ff8fa3" />
          <rect x="159" y="20" width="2" height="2" fill="#ff8fa3" />
          <!-- 监听大耳机 -->
          <rect x="142" y="21" width="22" height="2" fill="#4ecdc4" />
          <rect x="140" y="26" width="4" height="9" fill="#4ecdc4" />
          <rect x="162" y="26" width="4" height="9" fill="#4ecdc4" />
          <!-- 眼睛与腮红 -->
          <rect x="148" y="29" width="2" height="3" fill="#2b2129" />
          <rect x="156" y="29" width="2" height="3" fill="#2b2129" />
          <rect x="146" y="33" width="2" height="1" fill="#ff8fa3" />
          <rect x="158" y="33" width="2" height="1" fill="#ff8fa3" />
          <rect x="152" y="33" width="2" height="2" fill="#2b2129" />
        </g>

        <!-- 悬臂广播麦克风 -->
        <rect x="172" y="46" width="2" height="16" fill="#8d99ae" />
        <rect x="166" y="42" width="8" height="2" fill="#8d99ae" />
        <rect x="161" y="39" width="6" height="6" fill="#2b2d42" />
        <rect x="162" y="40" width="4" height="4" fill="#ef233c" />

        <!-- 经典橙色橘子汽水罐 + 叠放卡带 + 监听音箱 -->
        <rect x="188" y="53" width="6" height="9" fill="#ff7b00" />
        <rect x="189" y="52" width="4" height="1" fill="#d9d9d9" />
        <rect x="189" y="55" width="4" height="3" fill="#ffd166" />

        <rect x="200" y="58" width="16" height="4" fill="#2b2d42" />
        <rect x="202" y="59" width="12" height="2" fill="#ffbe0b" />
        <rect x="201" y="54" width="16" height="4" fill="#3a5a40" />
        <rect x="203" y="55" width="12" height="2" fill="#a3b18a" />

        <!-- 播音室监听器 -->
        <rect x="226" y="39" width="64" height="23" fill="#2d3142" />
        <rect x="228" y="41" width="60" height="19" fill="#3f455c" />
        <rect x="232" y="44" width="28" height="13" fill="#1b1e29" />
        <rect x="236" y="47" width="6" height="6" fill="#ffae52" />
        <rect x="238" y="49" width="2" height="2" fill="#1b1e29" />
        <rect x="250" y="47" width="6" height="6" fill="#ffae52" />
        <rect x="252" y="49" width="2" height="2" fill="#1b1e29" />
        <rect x="265" y="45" width="5" height="5" fill="#bfc0c0" />
        <rect x="273" y="45" width="5" height="5" fill="#bfc0c0" />
        <rect x="265" y="54" width="19" height="3" fill="#1b1e29" />
      </svg>

      <!-- 右上角怀旧标签 -->
      <div class="absolute top-2 right-2.5 font-vt text-xs tracking-wider px-2 py-0.5 bg-black/60 text-[#ffae52] border border-white/10">
        致 80 后的夜
      </div>
    </section>

    <!-- 3. 中间深夜树洞对话消息流 -->
    <main
      id="chatScroll"
      onclick="handleChatAreaTap(event)"
      style="background-color: var(--bg-screen);"
      class="flex-1 overflow-y-auto px-3.5 py-4 space-y-3.5 relative"
    >
      <div id="messageList" class="space-y-3.5"></div>
    </main>

    <!-- 4. 底部黄金热区：双态无缝切换引擎（状态 A：像素卡带录音机 ⇄ 状态 B：「说点啥」输入法） -->
    <footer
      id="bottomDeckZone"
      style="border-color: var(--border-dark); background-color: var(--bg-walkman);"
      class="border-t-2 shrink-0 relative z-20"
    >
      <!-- =================================================================== -->
      <!-- 状态 A：16-Bit Walkman 像素卡带录音机控制台（机身不动，小卡带往上弹出） -->
      <!-- =================================================================== -->
      <div id="walkmanConsole" class="p-3 space-y-2 relative">
        <!-- 机身铭牌 + 电平表 + 右上角【💬 说点啥】一键切入输入法 -->
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2 min-w-0">
            <span style="color: var(--accent-amber);" class="font-pixel text-[9px] tracking-wider">WALKMAN · 1982</span>
            <div class="flex items-end gap-0.5 h-3.5 px-1.5 py-0.5 bg-black/40 border border-white/10 rounded">
              <span id="vu1" class="w-1 h-1 bg-[#7ce8b5]"></span>
              <span id="vu2" class="w-1 h-1 bg-[#ffae52]"></span>
              <span id="vu3" class="w-1 h-1 bg-[#7ce8b5]"></span>
              <span id="vu4" class="w-1 h-1 bg-[#ff7575]"></span>
            </div>
          </div>

          <button
            type="button"
            onclick="switchToReplyMode()"
            style="background-color: var(--accent-cyan); color: #0b1921;"
            class="pixel-btn px-3 py-1 text-xs font-bold flex items-center gap-1.5 shrink-0 cursor-pointer"
          >
            <span>💬</span>
            <span>说点啥</span>
          </button>
        </div>

        <!-- 固定卡带仓底座（Walkman 位置全程不动，小卡带选曲架从顶部弹出） -->
        <div
          id="cassetteDoor"
          onclick="handleWindowClick()"
          style="background-color: #121521; border-color: var(--border-dark);"
          class="cassette-bay border-2 rounded-md p-2 pt-2.5 cursor-pointer select-none"
        >
          <!-- 从卡带仓顶部向上弹出的【42颗迷你小卡带造型】选曲抽屉 -->
          <div
            id="ejectedShelfDrawer"
            onclick="event.stopPropagation()"
            style="background-color: #1a1e30; border-color: var(--border-dark);"
            class="pop-up-cassette-rack rack-closed pixel-panel rounded-lg p-2.5 shadow-2xl space-y-2"
          >
            <div class="flex items-center justify-between text-[11px] px-0.5">
              <span style="color: var(--accent-mint);" class="font-bold">⏏ 左右滑动挑一盘小磁带 (全部50盘完整全曲 · 32和弦)：</span>
              <button
                type="button"
                onclick="toggleEjectDrawer(false)"
                style="color: var(--text-sub);"
                class="text-xs px-1.5 py-0.5 hover:text-white cursor-pointer"
              >
                收起 ✕
              </button>
            </div>

            <!-- 横向可滑动的一颗颗迷你像素盒式磁带造型 -->
            <div id="tapeShelfList" class="tape-shelf flex items-end gap-2.5 overflow-x-auto pt-1 pb-1.5">
              <!-- 由 JS 渲染 50 颗小卡带造型 -->
            </div>

            <!-- 咔哒装入磁带并播放的主操作键 -->
            <button
              type="button"
              onclick="insertAndPlaySelectedTape()"
              style="background-color: var(--accent-amber); color: #1d140c;"
              class="w-full pixel-btn py-2 text-xs font-bold flex items-center justify-center gap-1.5 cursor-pointer"
            >
              <span>⤵</span>
              <span id="insertBtnText">咔哒装入小磁带 #01 并开始播放 (32和弦全曲)</span>
            </button>
          </div>

          <!-- 卡带仓内部磁头暗槽 -->
          <div class="absolute inset-x-4 bottom-2 h-14 bg-[#0b0d14] border border-white/5 rounded flex items-end justify-center pb-1.5 pointer-events-none">
            <div class="flex items-center gap-3 opacity-55">
              <span class="w-3 h-2 bg-[#5a638a] inline-block"></span>
              <span class="w-5 h-2.5 bg-[#8d99ae] inline-block"></span>
              <span class="w-3 h-2 bg-[#5a638a] inline-block"></span>
            </div>
          </div>

          <!-- 拟物标准比例盒式磁带本体 -->
          <div
            id="cassetteBody"
            style="background-color: #2b314a; border-color: #090b12;"
            class="cassette-body border-2 rounded-md p-2 flex flex-col justify-between gap-1.5 min-h-[116px] shadow-md"
          >
            <!-- 磁带四角螺丝孔装饰 -->
            <div class="flex items-center justify-between px-0.5 pointer-events-none">
              <span class="w-1.5 h-1.5 rounded-full bg-[#121521] border border-white/15"></span>
              <span class="font-pixel text-[7px] text-white/35 tracking-widest">TYPE I · FULL LENGTH 90</span>
              <span class="w-1.5 h-1.5 rounded-full bg-[#121521] border border-white/15"></span>
            </div>

            <!-- 磁带上半部分：手写标签纸 + 神秘线索 -->
            <div
              id="tapeSticker"
              style="background-color: #f6e7cb; color: #241b15;"
              class="rounded-sm px-2.5 py-1 border border-black/45 shadow-inner"
            >
              <div class="flex items-center justify-between text-[10px] font-bold opacity-80 border-b border-black/15 pb-0.5">
                <span id="tapeSideTag">SIDE A · #01</span>
                <span id="tapeStatusText">已入舱 · 点此换带</span>
              </div>
              <div id="tapeClueTitle" class="text-xs font-bold truncate mt-0.5">
                雪夜街灯下哈出一口白气，想起二十岁的少年
              </div>
            </div>

            <!-- 磁带中腰部分：左右双卷轴齿轮 + 中央透明带窗 -->
            <div class="bg-[#181c2b] border border-black/60 rounded px-3 py-1 flex items-center justify-between gap-2">
              <div class="w-8 h-8 rounded-full bg-[#10131e] border-2 border-[#6c76a3] flex items-center justify-center shrink-0">
                <svg id="leftReel" viewBox="0 0 16 16" width="22" height="22" shape-rendering="crispEdges">
                  <rect x="7" y="1" width="2" height="14" fill="#ffae52" />
                  <rect x="1" y="7" width="14" height="2" fill="#ffae52" />
                  <rect x="3" y="3" width="2" height="2" fill="#ffae52" />
                  <rect x="11" y="11" width="2" height="2" fill="#ffae52" />
                  <rect x="11" y="3" width="2" height="2" fill="#ffae52" />
                  <rect x="3" y="11" width="2" height="2" fill="#ffae52" />
                  <rect x="6" y="6" width="4" height="4" fill="#10131e" />
                </svg>
              </div>

              <div class="flex-1 h-5 bg-[#0d1018] border border-white/15 rounded-sm flex items-center justify-between px-1.5 overflow-hidden">
                <div class="w-3.5 h-3.5 rounded-full bg-[#3a261d] border border-[#6e4736]"></div>
                <div class="flex-1 h-1 bg-[#4a3226] mx-1"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-[#3a261d] border border-[#6e4736]"></div>
              </div>

              <div class="w-8 h-8 rounded-full bg-[#10131e] border-2 border-[#6c76a3] flex items-center justify-center shrink-0">

    // =========================================================================
    // 2. 32和弦多轨音频合成引擎（电钢琴主旋律 + 民谣琶音 + 温暖弦乐 + 贝斯 + 鼓点）
    // =========================================================================
    async function ensureAudioReady() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;

      if (!state.audioCtx || state.audioCtx.state === 'closed') {
        state.audioCtx = new AudioContextClass();
        const bufferSize = state.audioCtx.sampleRate * 0.4;
        state.noiseBuffer = state.audioCtx.createBuffer(1, bufferSize, state.audioCtx.sampleRate);
        const data = state.noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      }
      if (state.audioCtx.state !== 'running') {
        try {
          await state.audioCtx.resume();
        } catch (e) {}
      }
      return state.audioCtx;
    }

    function playChipBeep(freq = 520, duration = 0.035, type = 'triangle', volume = 0.025) {
      if (state.isPlaying) return;
      ensureAudioReady().then(ctx => {
        if (!ctx || ctx.state !== 'running' || state.isPlaying) return;
        try {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(volume, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.onended = () => {
            try { osc.disconnect(); gain.disconnect(); } catch (e) {}
          };
          osc.start(now);
          osc.stop(now + duration + 0.01);
        } catch (e) {}
      });
    }

    function playMechanicalClick(type = 'insert') {
      ensureAudioReady().then(ctx => {
        if (!ctx) return;
        try {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'square';
          if (type === 'eject') {
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(420, now + 0.055);
          } else {
            osc.frequency.setValueAtTime(380, now);
            osc.frequency.exponentialRampToValueAtTime(140, now + 0.065);
          }
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.onended = () => {
            try { osc.disconnect(); gain.disconnect(); } catch (e) {}
          };
          osc.start(now);
          osc.stop(now + 0.075);
        } catch (e) {}
      });
    }

    // 32和弦多轨音符发声（电钢琴主奏 + 民谣分解琶音 + 低通温暖弦乐 + 贝斯 + 鼓点）
    function play32PolyStep(ctx, freq, durSec, bassFreq, isChorus, beatSec) {
      if (!ctx) return;
      if (ctx.state !== 'running') {
        ctx.resume().catch(() => {});
      }
      try {
        const now = ctx.currentTime;
        const noise = state.noiseBuffer;

        // 1. 32和弦电钢琴主旋律（基频 + 2倍泛音 + 微失谐合唱层）
        if (freq > 0) {
          const release = Math.max(durSec * 1.45, 0.35);
          const voices = [
            { f: freq, type: 'triangle', peak: isChorus ? 0.11 : 0.095, detune: -3 },
            { f: freq, type: 'sine', peak: isChorus ? 0.085 : 0.075, detune: 3 },
            { f: freq * 2, type: 'sine', peak: 0.024, detune: 0 }
          ];
          voices.forEach(v => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = v.type;
            osc.frequency.setValueAtTime(v.f, now);
            if (v.detune) osc.detune.setValueAtTime(v.detune, now);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(v.peak, now + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + release);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.onended = () => { try { osc.disconnect(); gain.disconnect(); } catch (e) {} };
            osc.start(now);
            osc.stop(now + release + 0.04);
          });
        }

        // 2. 和弦伴奏层（电贝斯根音 + 温暖弦乐群 + 民谣分解琶音 + 副歌轻架子鼓）
        if (bassFreq) {
          const chordDur = 1.65;
          const bOsc = ctx.createOscillator();
          const bGain = ctx.createGain();
          bOsc.type = 'sine';
          bOsc.frequency.setValueAtTime(bassFreq, now);
          bGain.gain.setValueAtTime(0.001, now);
          bGain.gain.linearRampToValueAtTime(isChorus ? 0.105 : 0.08, now + 0.015);
          bGain.gain.exponentialRampToValueAtTime(0.0001, now + chordDur);
          bOsc.connect(bGain);
          bGain.connect(ctx.destination);
          bOsc.onended = () => { try { bOsc.disconnect(); bGain.disconnect(); } catch (e) {} };
          bOsc.start(now);
          bOsc.stop(now + chordDur + 0.04);

          const padNotes = [bassFreq * 2, bassFreq * 2.5, bassFreq * 3];
          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(isChorus ? 1350 : 920, now);
          filter.connect(ctx.destination);

          padNotes.forEach((pFreq, idx) => {
            const sOsc = ctx.createOscillator();
            const sGain = ctx.createGain();
            sOsc.type = 'sawtooth';
            sOsc.frequency.setValueAtTime(pFreq, now);
            sOsc.detune.setValueAtTime((idx - 1) * 6, now);
            sGain.gain.setValueAtTime(0.0005, now);
            sGain.gain.linearRampToValueAtTime(isChorus ? 0.018 : 0.012, now + 0.16);
            sGain.gain.exponentialRampToValueAtTime(0.0001, now + chordDur + 0.25);
            sOsc.connect(sGain);
            sGain.connect(filter);
            sOsc.onended = () => { try { sOsc.disconnect(); sGain.disconnect(); } catch (e) {} };
            sOsc.start(now);
            sOsc.stop(now + chordDur + 0.3);
          });

          const arpNotes = [bassFreq * 2, bassFreq * 3, bassFreq * 4, bassFreq * 5];
          arpNotes.forEach((aFreq, stepIdx) => {
            const startAt = now + stepIdx * (beatSec * 0.5);
            const aOsc = ctx.createOscillator();
            const aGain = ctx.createGain();
            aOsc.type = 'triangle';
            aOsc.frequency.setValueAtTime(aFreq, startAt);
            aGain.gain.setValueAtTime(0.001, startAt);
            aGain.gain.linearRampToValueAtTime(0.028, startAt + 0.01);
            aGain.gain.exponentialRampToValueAtTime(0.0001, startAt + 0.55);
            aOsc.connect(aGain);
            aGain.connect(ctx.destination);
            aOsc.onended = () => { try { aOsc.disconnect(); aGain.disconnect(); } catch (e) {} };
            aOsc.start(startAt);
            aOsc.stop(startAt + 0.6);
          });

          if (isChorus && noise) {
            const kOsc = ctx.createOscillator();
            const kGain = ctx.createGain();
            kOsc.type = 'sine';
            kOsc.frequency.setValueAtTime(125, now);
            kOsc.frequency.exponentialRampToValueAtTime(38, now + 0.13);
            kGain.gain.setValueAtTime(0.12, now);
            kGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
            kOsc.connect(kGain);
            kGain.connect(ctx.destination);
            kOsc.start(now);
            kOsc.stop(now + 0.17);

            const snareAt = now + beatSec;
            const sSrc = ctx.createBufferSource();
            sSrc.buffer = noise;
            const sFilter = ctx.createBiquadFilter();
            sFilter.type = 'bandpass';
            sFilter.frequency.setValueAtTime(1120, snareAt);
            const sGain = ctx.createGain();
            sGain.gain.setValueAtTime(0.055, snareAt);
            sGain.gain.exponentialRampToValueAtTime(0.0001, snareAt + 0.14);
            sSrc.connect(sFilter);
            sFilter.connect(sGain);
            sGain.connect(ctx.destination);
            sSrc.start(snareAt);
            sSrc.stop(snareAt + 0.15);
          }
        }
      } catch (e) {}
    }

    function stopPlayback() {
      state.playbackSessionId += 1;
      state.timers.forEach(t => clearTimeout(t));
      state.timers = [];
      state.isPlaying = false;
      updateWalkmanVisuals();
    }

    async function startPlayback() {
      stopPlayback();
      const sessionId = state.playbackSessionId;
      const tape = state.selectedTape;
      const scaleMap = KEY_SCALES[tape.key] || KEY_SCALES.C;
      const chordMap = KEY_CHORDS[tape.key] || KEY_CHORDS.C;
      const beatSec = 60 / (tape.bpm || 84);

      state.isPlaying = true;
      updateWalkmanVisuals();

      const ctx = await ensureAudioReady();
      if (!ctx || sessionId !== state.playbackSessionId) return;

      let elapsed = 40;
      tape.notes.forEach(([solfege, beats, chordDeg, isChorus]) => {
        const durSec = beats * beatSec;
        const noteName = scaleMap[solfege] || 'R';
        const freq = BASE_FREQ[noteName] || 0;
        const bassFreq = chordDeg ? chordMap[chordDeg] : 0;

        const t = setTimeout(() => {
          if (sessionId !== state.playbackSessionId || !state.isPlaying) return;
          play32PolyStep(ctx, freq, durSec, bassFreq, Boolean(isChorus), beatSec);
        }, elapsed);
        state.timers.push(t);
        elapsed += durSec * 1000;
      });

      const endT = setTimeout(() => {
        if (sessionId !== state.playbackSessionId) return;
        state.isPlaying = false;
        updateWalkmanVisuals();
      }, elapsed + 350);
      state.timers.push(endT);
    }

    // =========================================================================
    // 3. 底部 Walkman 卡带仓交互（上方弹出 42 颗完整全曲小卡带 ⇄ 咔哒装入播放）
    // =========================================================================
    function toggleEjectDrawer(forceState) {
      const next = typeof forceState === 'boolean' ? forceState : !state.isEjected;
      state.isEjected = next;

      if (next) {
        stopPlayback();
        playMechanicalClick('eject');
      } else {
        playMechanicalClick('insert');
      }

      updateWalkmanVisuals();
      renderTapeShelf();
    }

    function handleWindowClick() {
      if (!state.isEjected) {
        toggleEjectDrawer(true);
      } else {
        insertAndPlaySelectedTape();
      }
    }

    function previewSelectTape(tapeNo) {
      const found = MYSTERY_TAPES.find(t => t.no === tapeNo);
      if (!found) return;
      state.selectedTape = found;
      playMechanicalClick('eject');
      updateWalkmanVisuals();
      renderTapeShelf();
    }

    function insertAndPlaySelectedTape() {
      state.isEjected = false;
      state.pendingGuessTape = state.selectedTape;
      state.guessAttemptCount = 0;
      playMechanicalClick('insert');
      startPlayback();

      if (state.isTyping) finishTypingNow();
      const promptLines = [
        `咔哒——磁带 #${state.selectedTape.no} 装进去啦！听着这段“${state.selectedTape.clue}”的调子，你听出是哪首老歌了吗？猜猜看，或者有什么想聊的跟我说说都行。`,
        `磁带 #${state.selectedTape.no} 正在转呢！那段完整版老旋律你听出歌名了吗？猜猜看，或者顺着这调子跟我讲讲你想到的事。`
      ];
      const msg = promptLines[Math.floor(Math.random() * promptLines.length)];
      setTimeout(() => {
        appendHostMessage(msg, false);
      }, 280);
    }

    function switchPrevNextTape(delta) {
      const idx = MYSTERY_TAPES.findIndex(t => t.no === state.selectedTape.no);
      const nextIdx = (idx + delta + MYSTERY_TAPES.length) % MYSTERY_TAPES.length;
      state.selectedTape = MYSTERY_TAPES[nextIdx];
      playMechanicalClick('insert');
      if (state.isPlaying) {
        state.pendingGuessTape = state.selectedTape;
        state.guessAttemptCount = 0;
        startPlayback();
      } else {
        updateWalkmanVisuals();
      }
      renderTapeShelf();
    }

    function togglePlayStop() {
      if (state.isPlaying) {
        stopPlayback();
      } else {
        state.isEjected = false;
        state.pendingGuessTape = state.selectedTape;
        state.guessAttemptCount = 0;
        playMechanicalClick('insert');
        startPlayback();
      }
    }

    // =========================================================================
    // 4. 底部双态无缝切换：状态 A（Walkman 卡带机） ⇄ 状态 B（「说点啥」输入法）
    // =========================================================================
    function switchToReplyMode() {
      state.isReplyMode = true;
      if (state.isEjected) {
        state.isEjected = false;
        updateWalkmanVisuals();
      }

      document.getElementById('walkmanConsole').classList.add('hidden');
      document.getElementById('replyInputConsole').classList.remove('hidden');

      document.getElementById('miniBarTapeInfo').textContent =
        `#${state.selectedTape.no} · ${state.selectedTape.clue}${state.isPlaying ? ' (播放中)' : ''}`;

      const input = document.getElementById('replyInput');
      input.focus();
      scrollToBottom();
    }

    function switchToWalkmanMode() {
      state.isReplyMode = false;
      const input = document.getElementById('replyInput');
      if (input) input.blur();

      document.getElementById('replyInputConsole').classList.add('hidden');
      document.getElementById('walkmanConsole').classList.remove('hidden');
      updateWalkmanVisuals();
    }

    function handleChatAreaTap(e) {
      if (state.isReplyMode && (e.target.id === 'chatScroll' || e.target.id === 'messageList')) {
        switchToWalkmanMode();
      }
    }

    if (window.visualViewport) {
      let maxViewportHeight = window.visualViewport.height;
      window.visualViewport.addEventListener('resize', () => {
        const currentH = window.visualViewport.height;
        if (currentH > maxViewportHeight) maxViewportHeight = currentH;
        if (
          state.isReplyMode &&
          maxViewportHeight - currentH < 80 &&
          document.activeElement !== document.getElementById('replyInput')
        ) {
          switchToWalkmanMode();
        }
      });
    }

    function updateWalkmanVisuals() {
      const tape = state.selectedTape;
      const lidGlass = document.getElementById('cassetteLidGlass');
      const body = document.getElementById('cassetteBody');
      const shelf = document.getElementById('ejectedShelfDrawer');
      const ejectKeyLabel = document.getElementById('ejectKeyLabel');
      const sticker = document.getElementById('tapeSticker');

      if (state.isEjected) {
        if (lidGlass) lidGlass.classList.add('ejected');
        if (body) body.classList.add('ejected');
        if (shelf) {
          shelf.classList.remove('rack-closed');
          shelf.classList.add('rack-open');
        }
        if (ejectKeyLabel) ejectKeyLabel.textContent = '⏏ 正在挑选小磁带';
        const insertBtn = document.getElementById('insertBtnText');
        if (insertBtn) insertBtn.textContent = `⤵ 咔哒装入小磁带 #${tape.no} (${tape.notes.length}音符全曲)`;
      } else {
        if (lidGlass) lidGlass.classList.remove('ejected');
        if (body) body.classList.remove('ejected');
        if (shelf) {
          shelf.classList.remove('rack-open');
          shelf.classList.add('rack-closed');
        }
        if (ejectKeyLabel) ejectKeyLabel.textContent = 'EJECT 弹出小磁带';
      }

      if (sticker) {
        sticker.style.backgroundColor = tape.stickerBg;
        sticker.style.color = tape.stickerText;
      }
      document.getElementById('tapeSideTag').textContent = `SIDE A · #${tape.no} (32和弦全曲)`;
      document.getElementById('tapeClueTitle').textContent = tape.clue;
      document.getElementById('tapeStatusText').textContent = state.isEjected
        ? '⏏ 舱门已开'
        : state.isPlaying
        ? '▶ 32和弦旋转中'
        : '■ 已入舱 · 点此换带';

      const leftReel = document.getElementById('leftReel');
      const rightReel = document.getElementById('rightReel');
      if (state.isPlaying && !state.isEjected) {
        leftReel.classList.add('reel-spinning');
        rightReel.classList.add('reel-spinning');
        document.getElementById('vu1').className = 'w-1 bg-[#7ce8b5] vu-bar-active-1';
        document.getElementById('vu2').className = 'w-1 bg-[#ffae52] vu-bar-active-2';
        document.getElementById('vu3').className = 'w-1 bg-[#7ce8b5] vu-bar-active-3';
        document.getElementById('vu4').className = 'w-1 bg-[#ff7575] vu-bar-active-4';
        document.getElementById('playStopIcon').textContent = '⏹';
        document.getElementById('playStopLabel').textContent = '停止';
      } else {
        leftReel.classList.remove('reel-spinning');
        rightReel.classList.remove('reel-spinning');
        document.getElementById('vu1').className = 'w-1 h-1 bg-[#7ce8b5]';
        document.getElementById('vu2').className = 'w-1 h-1 bg-[#ffae52]';
        document.getElementById('vu3').className = 'w-1 h-1 bg-[#7ce8b5]';
        document.getElementById('vu4').className = 'w-1 h-1 bg-[#ff7575]';
        document.getElementById('playStopIcon').textContent = '▶';
        document.getElementById('playStopLabel').textContent = '播放';
      }
    }

    function renderTapeShelf() {
      const shelfEl = document.getElementById('tapeShelfList');
      if (!shelfEl) return;
      shelfEl.innerHTML = MYSTERY_TAPES.map(t => {
        const selected = t.no === state.selectedTape.no;
        return `
          <button
            type="button"
            onclick="previewSelectTape('${t.no}')"
            style="background-color: #262b42; border-color: ${selected ? '#ffae52' : '#08070d'};"
            class="w-32 shrink-0 border-2 rounded-md p-1.5 text-left cursor-pointer transition-all flex flex-col justify-between gap-1.5 ${selected ? '-translate-y-1.5 shadow-xl ring-2 ring-[#ffae52]' : 'opacity-90 hover:opacity-100'}"
          >
            <div class="flex items-center justify-between px-0.5 text-[8px] font-pixel text-white/45">
              <span>•</span>
              <span>#${t.no}</span>
              <span>•</span>
            </div>

            <div
              style="background-color: ${t.stickerBg}; color: ${t.stickerText};"
              class="rounded-sm px-1.5 py-1 border border-black/40"
            >
              <div class="text-[9px] font-bold opacity-75 border-b border-black/15 pb-0.5 flex justify-between">
                <span>SIDE A</span>
                <span>${selected ? '★已选' : '全曲'}</span>
              </div>
              <div class="text-[11px] font-bold line-clamp-2 mt-0.5 leading-tight h-7">${t.clue}</div>
            </div>

            <div class="bg-[#121521] border border-black/60 rounded-sm px-2 py-1 flex items-center justify-between">
              <span class="w-3.5 h-3.5 rounded-full bg-[#090b12] border border-[#ffae52] flex items-center justify-center">
                <span class="w-1 h-1 bg-[#ffae52]"></span>
              </span>
              <span class="flex-1 h-1.5 bg-[#3a261d] mx-1.5 border-y border-white/10"></span>
              <span class="w-3.5 h-3.5 rounded-full bg-[#090b12] border border-[#ffae52] flex items-center justify-center">
                <span class="w-1 h-1 bg-[#ffae52]"></span>
              </span>
            </div>

            <div class="mx-auto w-[66%] h-2 bg-[#1a1e2e] border-t border-x border-black/70 rounded-t flex items-center justify-around px-1.5">
              <span class="w-1 h-1 rounded-full bg-[#08070d]"></span>
              <span class="w-1.5 h-1 bg-[#4a3226]"></span>
              <span class="w-1 h-1 rounded-full bg-[#08070d]"></span>
            </div>
          </button>
        `;
      }).join('');
    }

    // =========================================================================
    // 5. FM 19.82 树洞电台 · 极简留白与陈述式邀请对话引擎（把话筒交给听众）
    // =========================================================================
    function reflectPronouns(text) {
      return text
        .replace(/我自己/g, '你__SELF__')
        .replace(/我的/g, '你的')
        .replace(/我/g, '你')
        .replace(/你__SELF__/g, '你自己')
        .replace(/咱们/g, '你们');
    }
    const reflectedPronouns = reflectPronouns;

    const RADIO_RULES = [
      {
        regex: /(?:放首歌|点歌|听歌|老歌|音乐|八音盒|磁带|猜歌|换一盘)(.*)/i,
        replies: [
          '好呀，点一下底下卡带机上的【⏏ EJECT 弹出小磁带】，就能挑一盘完整版老歌放起来，听完想聊什么我都在。',
          '随身听里装满了整整 50 盘完整版老磁带，你点底部【⏏ EJECT 弹出小磁带】随便挑一盘听听，我在播音室陪着你。'
        ]
      },
      {
        regex: /(?:小时候|童年|以前|当年|上学|初中|高中|大学|同学|同桌|小霸王|魂斗罗|健力宝|网吧|漫画)(.*)/,
        replies: [
          '一提起“{0}”，那股熟悉的旧时光画面一下子就出来了。顺着这段记忆，你想往下多讲讲都行，我在这儿听着。',
          '咱们这代人对“{0}”总有说不完的念想。你接着往下说，当时的人和事，老伙计都爱听。'
        ]
      },
      {
        regex: /(?:为什么|凭什么|难道|是不是|怎么才能|怎么办|有什么意义|图什么|图啥)(.+)/,
        replies: [
          '嘿，老伙计，白天在外面已经够累了，夜里在树洞电台咱就不自己考自己啦。不找原因，你只管跟我讲讲今天遇到的事，我就在这儿听着。',
          '听起来你心里正压着事呢。今晚不解这道题，把问号放一边，想跟我说说今天发生了什么都行。'
        ]
      },
      {
        regex: /(?:工作|加班|领导|同事|客户|老板|房贷|孩子|辅导作业|父母|压力|熬夜|好累|太累|撑不住|中年)(.*)/,
        replies: [
          '辛苦啦，白天在外面习惯把情绪调成静音，夜里在这儿不用端着。关于“{0}”，你想倒多少苦水我都接着，慢慢说就行。',
          '嗯，我懂这种扛着担子的感觉。播音室很安静，你接着往下讲，把心里的事说出来会舒服些。'
        ]
      },
      {
        regex: /(?:孤独|孤单|没人懂|没有人理解|一个人|委屈|难过|想哭|失眠|睡不着|朋友|老友|爱人|家人)(.*)/,
        replies: [
          '夜深的时候，“{0}”的感觉总会悄悄冒出来。在这个频道里不用客气，你心里惦记着什么、想说什么，我都听着呢。',
          '大人世界里的心事确实不容易随便跟人讲，但树洞一直为你开着。你想从哪说起都行，我陪着你。'
        ]
      },
      {
        regex: /(?:觉得自己|感觉自己|我好|我很|我真|焦虑|迷茫|害怕|担心|没用|失败|内耗|不行)(.*)/,
        replies: [
          '听你这么说，挺心疼你的，你只是连续运转太久、太想把事情做好了。今晚在这儿不用数落自己，想聊聊最近发生的事，我都在。',
          '在 FM 19.82 树洞电台，你不需要向任何人证明什么。心里有什么压着的地方，慢慢讲出来就好。'
        ]
      },
      {
        regex: /(?:开心|快乐|幸福|顺利|喜欢|好吃|好看|小事|治愈|棒|猫|狗|晚风|月亮|星星|喝酒|撸串|散步)(.*)/,
        replies: [
          '隔着电波都能感受到你嘴角上扬的温度，听着真让人替你开心。多跟我讲讲当时的画面吧，我爱听这些烟火气。',
          '真好，把这份“{0}”留进今晚的播音笔记里啦。你要是还想接着分享，老伙计一直听着呢。'
        ]
      }
    ];

    function buildRadioReply(rawInput) {
      const cleaned = rawInput.trim().replace(/[.!?。！？]+$/g, '');
      const lower = cleaned.toLowerCase();
      const isQuestion = /[?？]$/.test(rawInput.trim());
      state.turnCount += 1;

      if (state.pendingGuessTape) {
        const tape = state.pendingGuessTape;
        const hitExact = tape.keywords.some(kw => lower.includes(kw.toLowerCase()));
        const admittedUnknown = /(?:没有听出来|没听出来|听不出来|听不出|不知道|猜不出|猜不到|忘记了|忘了|记不清|没印象|叫啥|哪首|什么歌|啥歌|提示|提醒|公布|揭晓|不记得|想不起来|耳熟)/.test(cleaned);
        const guessedOther = OTHER_SONG_HINTS.find(s => s.keywords.some(k => lower.includes(k)));

        if (hitExact) {
          state.pendingGuessTape = null;
          state.guessAttemptCount = 0;
          const hook = tape.hooks[Math.floor(Math.random() * tape.hooks.length)];
          return `一耳朵就听出来了，正是${tape.answer}。${hook}`;
        }

        if (admittedUnknown) {
          state.guessAttemptCount += 1;
          if (state.guessAttemptCount === 1) {
            const firstStepTemplates = [
              `没关系，老磁带调子确实容易一时对不上号。我给你提个醒——${tape.hint}，再想想看。`,
              `没关系，咱们慢慢来。我给你递个小提醒：${tape.hint}，这下是不是有点印象了？`
            ];
            return firstStepTemplates[Math.floor(Math.random() * firstStepTemplates.length)];
          }

          state.pendingGuessTape = null;
          state.guessAttemptCount = 0;
          const secondStepPivotTemplates = [
            `哈哈，没关系，这盘其实是${tape.answer}。咱们不猜歌啦，今晚播音室很安静，你心里装了什么事，或者今天遇到了什么，想跟我说说都行。`,
            `哈哈，原来这盘磁带是${tape.answer}。不跟歌名较劲啦，咱们换个轻松的，你今天过得怎么样、或者想起什么旧事，随便讲给我听听。`
          ];
          return secondStepPivotTemplates[Math.floor(Math.random() * secondStepPivotTemplates.length)];
        }

        if (guessedOther) {
          state.pendingGuessTape = null;
          state.guessAttemptCount = 0;
          return `哈哈，这盘其实是${tape.answer}，不过你一开口就联想到了${guessedOther.name}，说明你心里正装着${guessedOther.vibe}。既然提起了它，有什么想跟我说的，尽管讲就行。`;
        }

        state.pendingGuessTape = null;
        state.guessAttemptCount = 0;
      }

      for (const rule of RADIO_RULES) {
        const match = cleaned.match(rule.regex);
        if (match) {
          const captured = (match[1] || match[0] || '').trim();
          const reflected = reflectPronouns(captured || cleaned);
          const tpl = rule.replies[Math.floor(Math.random() * rule.replies.length)];
          const fullReflected = reflectPronouns(cleaned);

          state.memoryQueue.push(fullReflected);
          if (state.memoryQueue.length > 3) state.memoryQueue.shift();

          return tpl.replace(/\{0\}/g, reflected || fullReflected);
        }
      }

      if (isQuestion) {
        const reflected = reflectPronouns(cleaned);
        return `嘿，今晚咱们不找标准答案，你把问号先放一边，直接跟老伙计讲讲关于“${reflected}”的故事吧，我在这儿听着。`;
      }

      if (state.memoryQueue.length > 0 && state.turnCount % 3 === 0) {
        const recalled = state.memoryQueue.shift();
        const nostalgiaSparks = [
          '听着你讲这些，感觉特别真诚。你要是还想接着往下说，树洞一直在这儿陪着你。',
          '我把你刚才讲的“' + recalled + '”都记在心里了。顺着你的思绪，还有什么想倒出来的，随便讲就行。',
          '老伙计，夜还长，不着急总结，你想到哪说到哪，我都在这儿听着。'
        ];
        return nostalgiaSparks[Math.floor(Math.random() * nostalgiaSparks.length)];
      }

      const mirrored = reflectPronouns(cleaned);
      const gentleFollowUps = [
        `嗯，我听着呢。听到你说“${mirrored}”，挺有感触的。你接着往下讲，想多说点也没事。`,
        `我把你讲的“${mirrored}”记在今晚的播音笔记里了。把这些说出来会舒服点吧，还有什么想跟我说的，树洞都接着。`,
        `听你这么聊起“${mirrored}”，特别真实。不着急，顺着你的心意慢慢往下说就行，我一直听着。`
      ];
      return gentleFollowUps[Math.floor(Math.random() * gentleFollowUps.length)];
    }

    // =========================================================================
    // 6. 消息气泡渲染与主题切换
    // =========================================================================
    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function scrollToBottom() {
      const chat = document.getElementById('chatScroll');
      if (chat) chat.scrollTop = chat.scrollHeight;
    }

    function appendListenerMessage(text) {
      const list = document.getElementById('messageList');
      const row = document.createElement('div');
      row.className = 'flex justify-end';
      row.innerHTML = `
        <div class="max-w-[82%] flex flex-col items-end gap-1">
          <span style="color: var(--text-sub);" class="font-vt text-xs tracking-wider px-1">老伙计来信</span>
          <div style="background-color: var(--bg-bubble-user);" class="pixel-panel px-3 py-2 text-xs sm:text-sm leading-relaxed rounded-md select-text">
            ${escapeHtml(text)}
          </div>
        </div>
      `;
      list.appendChild(row);
      scrollToBottom();
    }

    function appendHostMessage(text, instant = false) {
      const list = document.getElementById('messageList');
      const row = document.createElement('div');
      row.className = 'flex items-start gap-2';
      row.innerHTML = `
        <div style="background-color: var(--bg-bubble-bot);" class="w-8 h-8 pixel-panel flex items-center justify-center shrink-0 mt-4 rounded">
          <svg viewBox="0 0 16 16" width="24" height="24" class="avatar-svg" shape-rendering="crispEdges">
            <rect x="3" y="4" width="10" height="9" fill="#f7d098" />
            <rect x="3" y="2" width="2" height="2" fill="#f7d098" />
            <rect x="11" y="2" width="2" height="2" fill="#f7d098" />
            <rect x="2" y="3" width="12" height="1" fill="#4ecdc4" />
            <rect x="1" y="5" width="2" height="5" fill="#4ecdc4" />
            <rect x="13" y="5" width="2" height="5" fill="#4ecdc4" />
            <rect x="5" y="7" width="2" height="2" fill="#2b2129" />
            <rect x="9" y="7" width="2" height="2" fill="#2b2129" />
            <rect x="4" y="10" width="2" height="1" fill="#ff8fa3" />
            <rect x="10" y="10" width="2" height="1" fill="#ff8fa3" />
          </svg>
        </div>

        <div class="max-w-[84%] flex flex-col items-start gap-1">
          <span style="color: var(--accent-amber);" class="font-vt text-xs tracking-wider px-1">主播 · 阿猫 (FM 19.82)</span>
          <div style="background-color: var(--bg-bubble-bot);" class="pixel-panel px-3 py-2 text-xs sm:text-sm leading-relaxed rounded-md select-text">
            <span class="msg-content"></span><span style="background-color: var(--accent-amber);" class="pixel-cursor inline-block w-1.5 h-3 ml-1 align-middle"></span>
          </div>
        </div>
      `;
      list.appendChild(row);
      scrollToBottom();

      const contentEl = row.querySelector('.msg-content');
      const cursorEl = row.querySelector('.pixel-cursor');

      if (instant) {
        contentEl.textContent = text;
        cursorEl.remove();
        scrollToBottom();
        return;
      }

      let i = 0;
      state.isTyping = true;
      const skipBtn = document.getElementById('skipBtn');
      if (skipBtn) skipBtn.classList.remove('hidden');

      state.finishCallback = () => {
        clearInterval(state.typingTimer);
        contentEl.textContent = text;
        cursorEl.remove();
        state.isTyping = false;
        state.finishCallback = null;
        if (skipBtn) skipBtn.classList.add('hidden');
        scrollToBottom();
      };

      state.typingTimer = setInterval(() => {
        if (i < text.length) {
          contentEl.textContent += text[i++];
          if (i % 4 === 0 && i < 60) playChipBeep(480 + (i % 4) * 35, 0.02, 'triangle', 0.018);
          scrollToBottom();
        } else {
          state.finishCallback();
        }
      }, 26);
    }

    function finishTypingNow() {
      if (state.finishCallback) state.finishCallback();
    }

    function handleSendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('replyInput');
      const val = input.value.trim();
      if (!val) return;

      if (state.isTyping) finishTypingNow();
      input.value = '';
      playChipBeep(587, 0.04, 'square', 0.025);

      appendListenerMessage(val);
      switchToWalkmanMode();

      const reply = buildRadioReply(val);
      setTimeout(() => {
        appendHostMessage(reply, false);
      }, 300);
    }

    function toggleStudioTheme() {
      const isSunset = document.body.classList.toggle('theme-sunset');
      document.getElementById('themeIcon').textContent = isSunset ? '🌙' : '🏮';
      document.getElementById('themeLabel').textContent = isSunset ? '星空' : '暖炉';
      playChipBeep(440, 0.05);
    }

    const OPENING_SCRIPTS = [
      [
        '滋滋……调频锁定 FM 19.82 树洞电台。晚上好，老伙计，我是值班主播阿猫。播音室的橘子汽水刚开盖，台灯也拧亮了。',
        '今晚不讲道理，我想听点具体的——你可以点【💬 说点啥】给我讲讲今天发生的一件小事，或者点底下随身听的【⏏ EJECT 弹出小磁带】从 50 盘完整版 32 和弦老磁带里挑一盘听完回来猜猜看！'
      ],
      [
        '欢迎回到 FM 19.82 树洞电台，咱们 80 后的深夜小据点。白天在外面当大人辛苦啦，这会儿不用端着。',
        '点底下随身听的【⏏ EJECT 弹出小磁带】能弹出一排整整 50 盘完整全曲 32 和弦老磁带，挑一盘推进去听听，或者直接点【💬 说点啥】跟老伙计聊聊今天的故事！'
      ]
    ];

    function playOpeningBroadcast() {
      const list = document.getElementById('messageList');
      list.innerHTML = '';
      const script = OPENING_SCRIPTS[Math.floor(Math.random() * OPENING_SCRIPTS.length)];
      appendHostMessage(script[0], true);
      setTimeout(() => {
        appendHostMessage(script[1], false);
      }, 240);
    }

    function retuneRadio() {
      if (state.isTyping) finishTypingNow();
      stopPlayback();
      state.isEjected = false;
      state.memoryQueue = [];
      state.turnCount = 0;
      state.pendingGuessTape = null;
      state.guessAttemptCount = 0;
      switchToWalkmanMode();
      playMechanicalClick('insert');
      playOpeningBroadcast();
    }

    window.onload = function () {
      updateWalkmanVisuals();
      renderTapeShelf();
      playOpeningBroadcast();
    };
  </script>
